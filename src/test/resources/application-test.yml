spring:
  datasource:
    # NON_KEYWORDS=KEY: space.key 컬럼 — KEY는 H2 예약어(Postgres에선 비예약). 없으면 create-drop DDL 실패
    url: jdbc:h2:mem:wikidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  test:
    database:
      replace: none   # @DataJpaTest가 이 yml의 H2 URL(NON_KEYWORDS=KEY)을 그대로 쓰게 함
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/.well-known/jwks.json

eureka:
  client:
    enabled: false

platform:
  jwt:
    issuer: http://localhost:9000
    audience: platform-api
  org-grpc:
    host: localhost
    port: 9131
  grpc:
    enabled: false   # 실 포트 바인딩 금지 — gRPC 테스트는 in-process 서버로 띄운다
  wiki:
    files-dir: ${java.io.tmpdir}/wiki-test-files
    trash:
      enabled: false   # 스케줄러 자동 tick 금지 — 보존 테스트가 시각을 직접 넣는다
    attachment-reconciliation:
      enabled: false
    migration-worker:
      enabled: false   # 스케줄러 자동 tick 금지 — worker 테스트가 시각을 직접 넣는다
    collaboration:
      ticket-ttl: PT1M
  events:
    enabled: false   # 실 Redis 발행 비활성 — 테스트는 인메모리 페이크 빈

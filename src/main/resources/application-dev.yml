# dev 프로필 — 도커 풀스택과 나란히 실행 (포트 +10000).
# Redis 논리 DB 1로 분리 → 도커 wiki(db0)와 스트림/컨슈머그룹이 안 섞이게 한다.
# org gRPC는 dev org(:19131)로 연결.
server:
  port: 19110
spring:
  data:
    redis:
      database: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:19000/.well-known/jwks.json
eureka:
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
platform:
  org-grpc:
    port: 19131

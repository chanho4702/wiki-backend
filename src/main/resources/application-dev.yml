# dev 프로필 — 도커 풀스택과 나란히 실행 (포트 +10000).
# Redis 논리 DB 1로 분리 → 도커 wiki(db0)와 스트림/컨슈머그룹이 안 섞이게 한다.
# org gRPC는 dev org(:19131)로 연결.
server:
  port: 19110
spring:
  data:
    redis:
      database: 1
      # 도커 Redis의 호스트 게시 포트(기본 16379). 127.0.0.1:6379는 호스트의 Windows Redis 3.2(Streams 없음 —
      # 이벤트 XADD가 실패한다)라 그리로 붙으면 안 된다(2026-09-13). compose REDIS_HOST_PORT와 같은 값으로.
      port: ${REDIS_PORT:16379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:19000/.well-known/jwks.json
eureka:
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
platform:
  org-grpc:
    port: 19131

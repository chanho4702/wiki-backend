server:
  port: 9110
spring:
  application:
    name: wiki-backend
  datasource:
    url: ${WIKI_DB_URL:jdbc:postgresql://localhost:5433/wikidb}
    username: ${WIKI_DB_USERNAME:keycloak}
    password: ${WIKI_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    # 이메일 알림 채널(W23). host가 비면 아무것도 발송하지 않고 알림함만 남는다 — OpenSearch와 같은 선택 옵션.
    host: ${WIKI_MAIL_HOST:}
    port: ${WIKI_MAIL_PORT:587}
    username: ${WIKI_MAIL_USERNAME:}
    password: ${WIKI_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${WIKI_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${WIKI_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${WIKI_MAX_ATTACHMENT_MB:20}MB
      max-request-size: ${WIKI_MAX_ATTACHMENT_MB:20}MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
  # 색인기(search-service) 전용 콘텐츠 조달 서버. 내부망 전용 — compose에서 호스트 포트를 열지 않는다.
  grpc:
    enabled: ${WIKI_GRPC_ENABLED:true}
    port: ${WIKI_GRPC_PORT:9111}
  wiki:
    files-dir: ${WIKI_FILES_DIR:./data/attachments}
    storage:
      # 기존 첨부는 행별 storage_backend로 계속 읽고, 신규 업로드 대상만 전환한다.
      write-backend: ${WIKI_STORAGE_WRITE_BACKEND:local}
      s3:
        enabled: ${WIKI_S3_ENABLED:false}
        bucket: ${WIKI_S3_BUCKET:wiki-attachments}
        region: ${WIKI_S3_REGION:ap-northeast-2}
        endpoint: ${WIKI_S3_ENDPOINT:}
        path-style-access: ${WIKI_S3_PATH_STYLE_ACCESS:false}
        access-key: ${WIKI_S3_ACCESS_KEY:}
        secret-key: ${WIKI_S3_SECRET_KEY:}
    trash:
      # 휴지통 보존 기간(W21-1). PT0S = 자동 영구 삭제 없음(기본).
      # 예: 30일 자동 정리는 WIKI_TRASH_RETENTION=P30D.
      enabled: ${WIKI_TRASH_RETENTION_JOB_ENABLED:true}
      retention: ${WIKI_TRASH_RETENTION:PT0S}
      interval: ${WIKI_TRASH_RETENTION_INTERVAL:PT6H}
    attachment-reconciliation:
      # 에디터가 저장 전에 닫혀 남긴 PENDING 업로드를 최신 본문과 대조해 확정/삭제한다.
      enabled: ${WIKI_ATTACHMENT_RECONCILIATION_ENABLED:true}
      pending-retention: ${WIKI_PENDING_ATTACHMENT_RETENTION:PT24H}
      interval: ${WIKI_ATTACHMENT_RECONCILIATION_INTERVAL:PT1H}
      initial-delay: ${WIKI_ATTACHMENT_RECONCILIATION_INITIAL_DELAY:PT5M}
      batch-size: ${WIKI_ATTACHMENT_RECONCILIATION_BATCH_SIZE:100}
    collaboration:
      # Access Token을 WebSocket query에 싣지 않기 위한 1회용 Redis ticket. 5분 초과는 부팅 시 거부한다.
      ticket-ttl: ${WIKI_COLLABORATION_TICKET_TTL:PT1M}
    mail:
      from: ${WIKI_MAIL_FROM:wiki@localhost}
      # 메일 본문의 링크가 가리킬 위키 주소(브라우저 기준).
      public-url: ${WIKI_PUBLIC_URL:http://localhost/wiki}
      # "하루 한 번 요약" 모드의 발송 시각(서버 시간, cron 6자리). 여러 인스턴스가 떠 있으면 각자 돈다 —
      # 같은 알림을 두 번 모으지는 않지만(emailed_at) 동시에 돌면 겹칠 수 있다. 인스턴스 하나만 켜 둔다.
      digest-cron: ${WIKI_MAIL_DIGEST_CRON:0 0 9 * * *}
      digest-enabled: ${WIKI_MAIL_DIGEST_ENABLED:true}
  events:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    # Compose에서도 등록해 gateway의 lb://wiki-backend가 여러 인스턴스를 분산·failover한다.
    # 검색 gRPC는 Docker DNS를 그대로 사용하므로 REST 라우팅과 독립적으로 유지된다.
    enabled: ${WIKI_EUREKA_ENABLED:true}

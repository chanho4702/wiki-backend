name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        env:
          GITHUB_ACTOR: chanho4702
          # 패키지가 platform-backend repo 상속 권한 모드라 GITHUB_TOKEN으로 크로스-repo 읽기 불가
          # → read:packages 스코프 PAT를 secret으로 사용 (gh 재로그인 시 갱신 필요)
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

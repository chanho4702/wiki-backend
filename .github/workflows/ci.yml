name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # GHCR 이미지 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew          # Windows에서 커밋된 실행비트 보정
      # build = test + bootJar. FlywaySchemaValidationTest가 Docker(Testcontainers)를 쓰는데
      # ubuntu-latest 러너엔 Docker가 있다.
      - run: ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: chanho4702
          # 패키지가 platform-backend repo 상속 권한 모드라 GITHUB_TOKEN으로 크로스-repo 읽기 불가
          # → read:packages 스코프 PAT를 secret으로 사용 (gh 재로그인 시 갱신 필요)
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile은 런타임 전용(위 bootJar 산출물 COPY) — sha 태그가 롤백 앵커다.
      - name: Build & push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chanho4702/wiki-backend:latest
            ghcr.io/chanho4702/wiki-backend:sha-${{ github.sha }}

      - name: Dispatch deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: chanho4702/infra-settings
          event-type: deploy
          client-payload: '{"service":"wiki-backend","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","repo":"${{ github.repository }}"}'

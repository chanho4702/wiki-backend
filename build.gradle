plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.platform'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }

repositories {
    // 미발행 common-proto를 로컬에서 먼저 물려 개발할 때만 켠다: -PuseMavenLocal
    // (기본은 꺼둔다 — 켜두면 스테일한 로컬 아티팩트가 발행본을 가려 CI와 결과가 갈린다)
    if (providers.gradleProperty('useMavenLocal').isPresent()) { mavenLocal() }
    mavenCentral()
    // common-proto 소비 — GitHub Packages (로컬: GITHUB_TOKEN env, CI: Actions access 부여 후 GITHUB_TOKEN)
    maven {
        url = uri('https://maven.pkg.github.com/chanho4702/platform-backend')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: 'chanho4702'
            password = System.getenv('GITHUB_TOKEN') ?: providers.gradleProperty('gpr.token').getOrElse('')
        }
    }
}

ext { set('springCloudVersion', '2025.1.2') }
ext { set('testcontainersVersion', '1.21.3') }
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // Boot 4 BOM이 testcontainers 버전을 관리하지 않아 직접 가져온다
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

def grpcVersion = '1.69.0'
def awsSdkVersion = '2.49.6'

dependencies {
    implementation 'com.platform:common-proto:0.5.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"   // 리플렉션(grpcurl 디버깅용) — org-service와 동일
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    // Flyway 마이그레이션 ↔ 엔티티 정합 검증용 실 Postgres — H2(create-drop)로는 마이그레이션이 안 돌아 못 잡는다
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = 'app.jar' }
